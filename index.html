<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Absensi PT Teratech Data Inti</title>
  <style>
    :root {
      --bg-day: linear-gradient(135deg, #e0f2fe 0%, #f8fafc 100%);
      --bg-night: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --btn-in: #0284c7;
      --btn-in-hover: #0369a1;
      --btn-out: #ea580c;
      --btn-out-hover: #c2410c;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg-day);
      transition: background 0.6s ease;
    }

    body.night-mode {
      background: var(--bg-night);
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    .illustration-box {
      width: 96px;
      height: 96px;
      margin: 0 auto 12px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      animation: floatAnim 3s ease-in-out infinite;
    }

    .day-illust { background: #fef3c7; box-shadow: 0 0 25px rgba(251, 191, 36, 0.4); }
    .night-illust { background: #e0e7ff; box-shadow: 0 0 25px rgba(99, 102, 241, 0.4); }

    @keyframes floatAnim {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .company-name {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #0284c7;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      color: var(--text-main);
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .clock-box {
      background: #f1f5f9;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .live-time {
      font-size: 32px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }

    .live-date {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    select, input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      background: #ffffff;
    }

    select:focus, input:focus {
      border-color: #0284c7;
    }

    .gps-status {
      font-size: 12px;
      color: #475569;
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px dashed #cbd5e1;
      margin-bottom: 18px;
      text-align: left;
      line-height: 1.45;
    }

    .gps-status.gps-error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
    }

    .btn-retry-gps {
      display: inline-block;
      margin-top: 6px;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.15s, background 0.3s;
    }

    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-clock-in { background: var(--btn-in); }
    .btn-clock-in:hover { background: var(--btn-in-hover); }

    .btn-clock-out { background: var(--btn-out); }
    .btn-clock-out:hover { background: var(--btn-out-hover); }

    .override-wrap {
      margin-top: 10px;
    }

    .btn-override {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      padding: 4px 6px;
    }

    .btn-override:hover {
      color: var(--text-main);
    }

    .success-box {
      display: none;
      padding: 10px 4px;
    }

    .success-icon {
      font-size: 54px;
      margin-bottom: 10px;
    }

    .success-msg {
      font-size: 15.5px;
      line-height: 1.6;
      color: var(--text-main);
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 16px;
    }

    .success-msg.late-msg {
      background: #fffbeb;
      border: 1px solid #fcd34d;
    }

    .btn-reset {
      background: #e2e8f0;
      color: #334155;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="company-name">PT Teratech Data Inti</div>

    <div id="mainSection">
      <div id="illustBox" class="illustration-box day-illust">☀️</div>
      <h1 id="greetingTitle">Selamat Pagi!</h1>
      <p id="greetingSub" class="subtitle">Yuk absen dulu sebelum mulai aktivitas hari ini.</p>

      <div class="clock-box">
        <div id="liveTime" class="live-time">00:00:00</div>
        <div id="liveDate" class="live-date">Memuat tanggal...</div>
      </div>

      <form id="absenForm">
        <div class="form-group">
          <label for="namaKaryawan">Nama Karyawan</label>
          <select id="namaKaryawan" required>
            <option value="" disabled selected>-- Pilih Nama Kamu --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="divisiKaryawan">Divisi</label>
          <select id="divisiKaryawan" required>
            <option value="" disabled selected>-- Pilih Divisi Kamu --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="keterangan">Catatan / Status (Opsional)</label>
          <input type="text" id="keterangan" placeholder="Kosongkan jika hadir normal (atau isi: Izin / WFH)" />
        </div>

        <div id="gpsBox" class="gps-status">
          📍 Mendeteksi lokasi kamu...
        </div>

        <button type="submit" id="submitBtn" class="btn-submit btn-clock-in">
          Clock In
        </button>

        <div class="override-wrap">
          <button type="button" id="overrideBtn" class="btn-override" onclick="toggleManualMode()">
            Ubah ke Clock Out
          </button>
        </div>
      </form>
    </div>

    <div id="successSection" class="success-box">
      <div id="successIcon" class="success-icon">🎉</div>
      <div id="successMessage" class="success-msg"></div>
      <button type="button" class="btn-reset" onclick="resetForm()">Kembali ke Halaman Awal</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMHAF0hy_gEE79JcQekpVHxDRxXaqEvwPCZRhJnK_EAB4bnSa2iYbRW71gjbHKtHEe/exec";

    const DAFTAR_KARYAWAN = [
      "Abdul Hafiz Ramadhan",
      "Andreas Ricardo Epafroditus",
      "Angela Febri Uli Harianja",
      "Arief Maulana",
      "Aris Jerry Fransiskus",
      "Ayuningtyas Kasran",
      "Dafii Kirana Rambo",
      "Dian Ruhyana",
      "Eka Ratna Wati",
      "Eko Kostaman",
      "Esti Satriani Daeli",
      "Fiki Liandre",
      "Firman Idris Rianto",
      "Ibrow Nababan",
      "Iska Byantara",
      "Kurnia Bagus Ivanda",
      "Lili Novita Sari",
      "M. Fauzia Rachman",
      "Marshal Aryuhda",
      "Mohammad Wisnu",
      "Mujahadah Taslimah Asyam",
      "Qonita Dwinta Yulianti",
      "Riesky Octava Yudi",
      "Ronal Ependi Tampubolon",
      "Sri Wahyu Ningsih",
      "Suyitno",
      "Tony Harianja",
      "Uma Rusma"
    ];

    const DAFTAR_DIVISI = [
      "President Director",
      "General Manager",
      "FO",
      "CME",
      "SITAC",
      "FAT",
      "LOGISTIK",
      "PROJECT CONTROL",
      "HSE",
      "SUPPORT & GA"
    ];

    function isiDropdown() {
      try {
        const selectNama = document.getElementById("namaKaryawan");
        if (selectNama) {
          DAFTAR_KARYAWAN.forEach(function(nama) {
            const opt = document.createElement("option");
            opt.value = nama;
            opt.textContent = nama;
            selectNama.appendChild(opt);
          });
        }

        const selectDivisi = document.getElementById("divisiKaryawan");
        if (selectDivisi) {
          DAFTAR_DIVISI.forEach(function(divisi) {
            const opt = document.createElement("option");
            opt.value = divisi;
            opt.textContent = divisi;
            selectDivisi.appendChild(opt);
          });
        }
      } catch (e) {
        console.error(e);
      }
    }

    let currentMode = "Clock In";
    let manualOverrideMode = null;

    function padZero(n) {
      return n < 10 ? "0" + n : "" + n;
    }

    function applyModeUI(mode, hours) {
      const illustBox = document.getElementById("illustBox");
      const greetingTitle = document.getElementById("greetingTitle");
      const greetingSub = document.getElementById("greetingSub");
      const submitBtn = document.getElementById("submitBtn");
      const overrideBtn = document.getElementById("overrideBtn");

      currentMode = mode;

      if (mode === "Clock In") {
        document.body.classList.remove("night-mode");
        illustBox.className = "illustration-box day-illust";
        illustBox.textContent = hours < 11 ? "☀️" : "🌤️";
        greetingTitle.textContent = hours < 11 ? "Selamat Pagi!" : "Selamat Siang!";
        greetingSub.textContent = "Yuk absen masuk dulu sebelum mulai aktivitas hari ini.";
        submitBtn.textContent = "Clock In";
        submitBtn.className = "btn-submit btn-clock-in";
        overrideBtn.textContent = "Ubah ke Clock Out";
      } else {
        document.body.classList.add("night-mode");
        illustBox.className = "illustration-box night-illust";
        illustBox.textContent = "🌙";
        greetingTitle.textContent = "Waktunya Pulang!";
        greetingSub.textContent = "Terima kasih untuk kerja kerasmu hari ini. Jangan lupa Clock Out ya!";
        submitBtn.textContent = "Clock Out";
        submitBtn.className = "btn-submit btn-clock-out";
        overrideBtn.textContent = "Ubah ke Clock In";
      }
    }

    function toggleManualMode() {
      const hours = new Date().getHours();
      const targetMode = currentMode === "Clock In" ? "Clock Out" : "Clock In";
      manualOverrideMode = targetMode;
      applyModeUI(targetMode, hours);
    }

    function updateClockAndMode() {
      try {
        const now = new Date();
        const hours = now.getHours();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        const totalMinutes = hours * 60 + minutes;

        const timeStr = padZero(hours) + ":" + padZero(minutes) + ":" + padZero(seconds);

        const hariList = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const bulanList = [
          "Januari", "Februari", "Maret", "April", "Mei", "Juni",
          "Juli", "Agustus", "September", "Oktober", "November", "Desember"
        ];
        const dateStr = hariList[now.getDay()] + ", " + now.getDate() + " " + bulanList[now.getMonth()] + " " + now.getFullYear();

        const liveTimeEl = document.getElementById("liveTime");
        const liveDateEl = document.getElementById("liveDate");
        if (liveTimeEl) liveTimeEl.textContent = timeStr;
        if (liveDateEl) liveDateEl.textContent = dateStr;

        const autoMode = (totalMinutes >= 240 && totalMinutes <= 899) ? "Clock In" : "Clock Out";
        const activeMode = manualOverrideMode || autoMode;
        applyModeUI(activeMode, hours);
      } catch (e) {
        console.error(e);
      }
    }

    let isLocationReady = false;
    let userCoords = "";
    let userAddress = "";

    function showLocationBlockedUI(reasonText) {
      isLocationReady = false;
      const gpsBox = document.getElementById("gpsBox");
      gpsBox.classList.add("gps-error");
      gpsBox.innerHTML =
        "⚠️ <b>Lokasi belum dinyalakan!</b><br>" +
        reasonText + "<br>" +
        "<button type='button' class='btn-retry-gps' onclick='detectLocation()'>Cek Ulang Lokasi</button>";
    }

    function detectLocation() {
      const gpsBox = document.getElementById("gpsBox");
      gpsBox.classList.remove("gps-error");

      if (!navigator.geolocation) {
        showLocationBlockedUI("Browser tidak mendukung deteksi lokasi.");
        return;
      }

      isLocationReady = false;
      gpsBox.innerHTML = "📍 Mendeteksi lokasi kamu...";

      navigator.geolocation.getCurrentPosition(
        async function(pos) {
          const lat = pos.coords.latitude.toFixed(6);
          const lon = pos.coords.longitude.toFixed(6);
          userCoords = lat + ", " + lon;
          isLocationReady = true;
          gpsBox.classList.remove("gps-error");
          gpsBox.innerHTML = "📍 Koordinat: <b>" + userCoords + "</b><br>Mengambil nama jalan...";

          try {
            const res = await fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lon);
            const data = await res.json();
            userAddress = data.display_name || userCoords;
            gpsBox.innerHTML = "📍 <b>Lokasi Terdeteksi:</b><br>" + userAddress;
          } catch (err) {
            userAddress = userCoords;
            gpsBox.innerHTML = "📍 Koordinat terdeteksi: <b>" + userCoords + "</b>";
          }
        },
        function() {
          showLocationBlockedUI("Aktifkan GPS di HP/browser dan izinkan akses lokasi agar bisa absen.");
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    document.getElementById("absenForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      if (!isLocationReady || !userCoords) {
        showLocationBlockedUI("Kamu belum bisa absen sebelum lokasi/GPS dinyalakan.");
        alert("Lokasi belum dinyalakan! Aktifkan GPS / izin lokasi dulu ya sebelum Clock In / Clock Out.");
        detectLocation();
        return;
      }

      const nama = document.getElementById("namaKaryawan").value;
      const divisi = document.getElementById("divisiKaryawan").value;
      const keterangan = document.getElementById("keterangan").value.trim();
      const submitBtn = document.getElementById("submitBtn");

      submitBtn.disabled = true;
      submitBtn.textContent = "Menyimpan absensi...";

      const now = new Date();
      const totalMinutes = now.getHours() * 60 + now.getMinutes();
      const jamSubmit = padZero(now.getHours()) + ":" + padZero(now.getMinutes());

      const payload = {
        nama: nama,
        divisi: divisi,
        jenis: currentMode,
        alamat: userAddress,
        koordinat: userCoords,
        keterangan: keterangan
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        document.getElementById("mainSection").style.display = "none";
        const successSection = document.getElementById("successSection");
        const successMessage = document.getElementById("successMessage");
        const successIcon = document.getElementById("successIcon");

        successMessage.classList.remove("late-msg");

        if (currentMode === "Clock In") {
          if (totalMinutes > 540) {
            successIcon.innerHTML = '<img src="telat.jpg" alt="Telat" style="width:140px;height:140px;object-fit:cover;border-radius:16px;">';
            successMessage.classList.add("late-msg");
            successMessage.innerHTML = "Selamat <b>" + nama + "</b>, kamu berhasil Clock In di jam <b>" + jamSubmit + "</b>, <b>TAPI KAMU TELAT!!</b> 😅 Besok harus on time ya!!!";
          } else {
            successIcon.textContent = "🎉";
            successMessage.innerHTML = "Selamat <b>" + nama + "</b> (" + divisi + "), kamu berhasil absen di jam <b>" + jamSubmit + "</b>, semangat yaa kerja hari ini!! 💪✨";
          }
       } else {
          successIcon.innerHTML = '<img src="pulang.jpg" alt="Clock Out" style="width:140px;height:140px;object-fit:cover;border-radius:16px;">';
          successMessage.innerHTML = "Selamat <b>" + nama + "</b> (" + divisi + "), makasih udah Clock Out di jam <b>" + jamSubmit + "</b>! Hati-hati di jalan dan selamat istirahat yaa!! 🌙✨";
        }

        successSection.style.display = "block";
      } catch (error) {
        alert("Gagal mengirim absen. Cek koneksi internet kamu lalu coba lagi.");
        submitBtn.disabled = false;
        updateClockAndMode();
      }
    });

    function resetForm() {
      manualOverrideMode = null;
      document.getElementById("absenForm").reset();
      document.getElementById("successSection").style.display = "none";
      document.getElementById("mainSection").style.display = "block";
      document.getElementById("submitBtn").disabled = false;
      updateClockAndMode();
      detectLocation();
    }

    isiDropdown();
    updateClockAndMode();
    setInterval(updateClockAndMode, 1000);
    detectLocation();
  </script>
</body>
</html>
