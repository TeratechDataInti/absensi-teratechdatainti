<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Absensi PT Teratech Data Inti</title>
  <style>
    :root {
      --bg-day: linear-gradient(135deg, #e0f2fe 0%, #f8fafc 100%);
      --bg-night: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --btn-in: #0284c7;
      --btn-in-hover: #0369a1;
      --btn-out: #ea580c;
      --btn-out-hover: #c2410c;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg-day);
      transition: background 0.6s ease;
    }

    body.night-mode {
      background: var(--bg-night);
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    .illustration-box {
      width: 96px;
      height: 96px;
      margin: 0 auto 12px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      animation: floatAnim 3s ease-in-out infinite;
    }

    .day-illust { background: #fef3c7; box-shadow: 0 0 25px rgba(251, 191, 36, 0.4); }
    .night-illust { background: #e0e7ff; box-shadow: 0 0 25px rgba(99, 102, 241, 0.4); }

    @keyframes floatAnim {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .company-name {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #0284c7;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      color: var(--text-main);
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .clock-box {
      background: #f1f5f9;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .live-time {
      font-size: 32px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }

    .live-date {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    select, input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      background: #ffffff;
    }

    select:focus, input:focus {
      border-color: #0284c7;
    }

    .gps-status {
      font-size: 12px;
      color: #475569;
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px dashed #cbd5e1;
      margin-bottom: 18px;
      text-align: left;
      line-height: 1.4;
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.15s, background 0.3s;
    }

    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-clock-in { background: var(--btn-in); }
    .btn-clock-in:hover { background: var(--btn-in-hover); }

    .btn-clock-out { background: var(--btn-out); }
    .btn-clock-out:hover { background: var(--btn-out-hover); }

    .success-box {
      display: none;
      padding: 10px 4px;
    }

    .success-icon {
      font-size: 54px;
      margin-bottom: 10px;
    }

    .success-msg {
      font-size: 15.5px;
      line-height: 1.6;
      color: var(--text-main);
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 16px;
    }

    .btn-reset {
      background: #e2e8f0;
      color: #334155;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="company-name">PT Teratech Data Inti</div>

    <div id="mainSection">
      <div id="illustBox" class="illustration-box day-illust">☀️</div>
      <h1 id="greetingTitle">Selamat Pagi!</h1>
      <p id="greetingSub" class="subtitle">Yuk absen dulu sebelum mulai aktivitas hari ini.</p>

      <div class="clock-box">
        <div id="liveTime" class="live-time">00:00:00</div>
        <div id="liveDate" class="live-date">Memuat tanggal...</div>
      </div>

      <form id="absenForm">
        <div class="form-group">
          <label for="namaKaryawan">Nama Karyawan</label>
          <select id="namaKaryawan" required>
            <option value="" disabled selected>-- Pilih Nama Kamu --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="keterangan">Catatan / Status (Opsional)</label>
          <input type="text" id="keterangan" placeholder="Kosongkan jika hadir normal (atau isi: Izin / WFH)" />
        </div>

        <div id="gpsBox" class="gps-status">
          📍 Mendeteksi lokasi kamu...
        </div>

        <button type="submit" id="submitBtn" class="btn-submit btn-clock-in">
          Clock In
        </button>
      </form>
    </div>

    <div id="successSection" class="success-box">
      <div id="successIcon" class="success-icon">🎉</div>
      <div id="successMessage" class="success-msg"></div>
      <button type="button" class="btn-reset" onclick="resetForm()">Kembali ke Halaman Awal</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMHAF0hy_gEE79JcQekpVHxDRxXaqEvwPCZRhJnK_EAB4bnSa2iYbRW71gjbHKtHEe/exec";

    const DAFTAR_KARYAWAN = [
      "Abdul Hafiz Ramadhan",
      "Andreas Ricardo Epafroditus",
      "Angela Febri Uli Harianja",
      "Arief Maulana",
      "Aris Jerry Fransiskus",
      "Ayuningtyas Kasran",
      "Dafii Kirana Rambo",
      "Dian Ruhyana",
      "Eka Ratna Wati",
      "Eko Kostaman",
      "Esti Satriani Daeli",
      "Fiki Liandre",
      "Firman Idris Rianto",
      "Ibrow Nababan",
      "Iska Byantara",
      "Kurnia Bagus Ivanda",
      "Lili Novita Sari",
      "M. Fauzia Rachman",
      "Marshal Aryuhda",
      "Mohammad Wisnu",
      "Mujahadah Taslimah Asyam",
      "Qonita Dwinta Yulianti",
      "Riesky Octava Yudi",
      "Ronal Ependi Tampubolon",
      "Sri Wahyu Ningsih",
      "Suyitno",
      "Tony Harianja",
      "Uma Rusma"
    ];

    function isiDropdownNama() {
      try {
        const selectNama = document.getElementById("namaKaryawan");
        if (!selectNama) return;
        DAFTAR_KARYAWAN.forEach(function(nama) {
          const opt = document.createElement("option");
          opt.value = nama;
          opt.textContent = nama;
          selectNama.appendChild(opt);
        });
      } catch (e) {
        console.error(e);
      }
    }

    let currentMode = "Clock In";

    function padZero(n) {
      return n < 10 ? "0" + n : "" + n;
    }

    function updateClockAndMode() {
      try {
        const now = new Date();
        const hours = now.getHours();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        const totalMinutes = hours * 60 + minutes;

        const timeStr = padZero(hours) + ":" + padZero(minutes) + ":" + padZero(seconds);

        const hariList = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const bulanList = [
          "Januari", "Februari", "Maret", "April", "Mei", "Juni",
          "Juli", "Agustus", "September", "Oktober", "November", "Desember"
        ];
        const dateStr = hariList[now.getDay()] + ", " + now.getDate() + " " + bulanList[now.getMonth()] + " " + now.getFullYear();

        const liveTimeEl = document.getElementById("liveTime");
        const liveDateEl = document.getElementById("liveDate");
        if (liveTimeEl) liveTimeEl.textContent = timeStr;
        if (liveDateEl) liveDateEl.textContent = dateStr;

        // 05:00 (300 menit) s.d. 17:29 (1049 menit) => Clock In
        // 17:30 (1050 menit) s.d. 04:59 (299 menit) => Clock Out
        const isClockInTime = totalMinutes >= 300 && totalMinutes <= 1049;

        const illustBox = document.getElementById("illustBox");
        const greetingTitle = document.getElementById("greetingTitle");
        const greetingSub = document.getElementById("greetingSub");
        const submitBtn = document.getElementById("submitBtn");

        if (isClockInTime) {
          currentMode = "Clock In";
          document.body.classList.remove("night-mode");
          illustBox.className = "illustration-box day-illust";
          illustBox.textContent = hours < 11 ? "☀️" : "🌤️";
          greetingTitle.textContent = hours < 11 ? "Selamat Pagi!" : "Selamat Siang!";
          greetingSub.textContent = "Yuk absen masuk dulu sebelum mulai aktivitas hari ini.";
          submitBtn.textContent = "Clock In";
          submitBtn.className = "btn-submit btn-clock-in";
        } else {
          currentMode = "Clock Out";
          document.body.classList.add("night-mode");
          illustBox.className = "illustration-box night-illust";
          illustBox.textContent = "🌙";
          greetingTitle.textContent = "Waktunya Pulang!";
          greetingSub.textContent = "Terima kasih untuk kerja kerasmu hari ini. Jangan lupa Clock Out ya!";
          submitBtn.textContent = "Clock Out";
          submitBtn.className = "btn-submit btn-clock-out";
        }
      } catch (e) {
        console.error(e);
      }
    }

    let userCoords = "Tidak terdeteksi";
    let userAddress = "Lokasi tidak diizinkan";

    function detectLocation() {
      const gpsBox = document.getElementById("gpsBox");
      if (!navigator.geolocation) {
        gpsBox.textContent = "📍 Browser tidak mendukung deteksi lokasi.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async function(pos) {
          const lat = pos.coords.latitude.toFixed(6);
          const lon = pos.coords.longitude.toFixed(6);
          userCoords = lat + ", " + lon;
          gpsBox.innerHTML = "📍 Koordinat: <b>" + userCoords + "</b><br>Mengambil nama jalan...";

          try {
            const res = await fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lon);
            const data = await res.json();
            userAddress = data.display_name || userCoords;
            gpsBox.innerHTML = "📍 <b>Lokasi Terdeteksi:</b><br>" + userAddress;
          } catch (err) {
            userAddress = userCoords;
            gpsBox.innerHTML = "📍 Koordinat terdeteksi: <b>" + userCoords + "</b>";
          }
        },
        function() {
          gpsBox.textContent = "⚠️ Izin lokasi mati. Aktifkan GPS di HP/browser agar alamat tercatat.";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    document.getElementById("absenForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const nama = document.getElementById("namaKaryawan").value;
      const keterangan = document.getElementById("keterangan").value.trim();
      const submitBtn = document.getElementById("submitBtn");

      submitBtn.disabled = true;
      submitBtn.textContent = "Menyimpan absensi...";

      const now = new Date();
      const jamSubmit = padZero(now.getHours()) + ":" + padZero(now.getMinutes());

      const payload = {
        nama: nama,
        jenis: currentMode,
        alamat: userAddress,
        koordinat: userCoords,
        keterangan: keterangan
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        document.getElementById("mainSection").style.display = "none";
        const successSection = document.getElementById("successSection");
        const successMessage = document.getElementById("successMessage");
        const successIcon = document.getElementById("successIcon");

        if (currentMode === "Clock In") {
          successIcon.textContent = "🎉";
          successMessage.innerHTML = "Selamat <b>" + nama + "</b>, kamu berhasil absen di jam <b>" + jamSubmit + "</b>, semangat yaa kerja hari ini!! 💪✨";
        } else {
          successIcon.textContent = "🏠";
          successMessage.innerHTML = "Selamat <b>" + nama + "</b>, kamu berhasil clock out di jam <b>" + jamSubmit + "</b>, hati-hati di jalan dan selamat istirahat yaa!! 🌙✨";
        }

        successSection.style.display = "block";
      } catch (error) {
        alert("Gagal mengirim absen. Cek koneksi internet kamu lalu coba lagi.");
        submitBtn.disabled = false;
        updateClockAndMode();
      }
    });

    function resetForm() {
      document.getElementById("absenForm").reset();
      document.getElementById("successSection").style.display = "none";
      document.getElementById("mainSection").style.display = "block";
      document.getElementById("submitBtn").disabled = false;
      updateClockAndMode();
    }

    isiDropdownNama();
    updateClockAndMode();
    setInterval(updateClockAndMode, 1000);
    detectLocation();
  </script>
</body>
</html>
